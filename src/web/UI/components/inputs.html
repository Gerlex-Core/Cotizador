<!-- Reusable Input & Control Components Template Snippets -->
<template id="input-text-template">
    <div class="space-y-1">
        <label class="font-semibold text-slate-300 text-xs label-title"></label>
        <input type="text" class="w-full bg-[var(--bg-primary)] border border-[var(--border-default)] rounded-xl px-3 py-2 text-xs text-[var(--text-primary)] placeholder-slate-500 focus:border-[var(--accent-primary)] focus:outline-none transition">
    </div>
</template>

<template id="input-number-template">
    <div class="space-y-1">
        <label class="font-semibold text-slate-300 text-xs label-title"></label>
        <input type="number" class="w-full bg-[var(--bg-primary)] border border-[var(--border-default)] rounded-xl px-3 py-2 text-xs text-[var(--text-primary)] font-bold text-right focus:border-[var(--accent-primary)] focus:outline-none transition">
    </div>
</template>

<template id="checkbox-template">
    <label class="flex items-center space-x-2 font-semibold text-xs text-slate-300 cursor-pointer">
        <input type="checkbox" class="w-4 h-4 text-[var(--accent-primary)] rounded bg-[var(--bg-primary)] border-[var(--border-default)]">
        <span class="checkbox-label"></span>
    </label>
</template>
