<!-- BOTTOM DISPLAY FOOTER BAR -->
<footer class="bg-[var(--bg-card)] border border-[var(--border-default)] rounded-2xl px-4 py-2 flex items-center justify-between shrink-0 shadow-lg backdrop-blur-md">
    <div class="flex items-center space-x-2 text-xs font-medium text-[var(--text-secondary)]">
        <span>Subtotal: <strong id="footSubtotal" class="text-[var(--text-primary)]">0.00</strong></span>
        <span>•</span>
        <span>Envío: <strong id="footShipping" class="text-[var(--text-primary)]">0.00</strong></span>
        <span>•</span>
        <span class="text-emerald-400">Pagado: <strong id="footPaid">0.00</strong></span>
    </div>
    <div class="text-sm font-bold text-[var(--accent-primary)]">
        TOTAL: <span id="footTotal" class="text-base font-extrabold text-[var(--text-primary)]">0.00</span>
    </div>
</footer>
